services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:latest}
    container_name: floci
    user: root
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    environment:
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-hybrid}
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      FLOCI_DEFAULT_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
    volumes:
      # Necessário para os serviços que o Floci sobe via Docker real
      # (Lambda, RDS, ElastiCache, ECS, EKS, MSK, etc.)
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistência do estado local (modo hybrid/persistent/wal)
      - ./data:/app/data
      # Scripts de inicialização (compatível com /etc/localstack/init do LocalStack)
      - ./init:/etc/localstack/init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
